services:
  minio:
    build:
      context: .
      dockerfile: ./bin/Dockerfile
    image: secure-minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-nebulae}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-gargantua#7}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    command: [ "server", "--console-address", ":9001", "/data" ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: false # must be false because MinIO writes data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - vol_data:/data

  minio-buckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set dockerminio http://minio:9000 ${MINIO_USER:-nebulae} ${MINIO_PASSWORD:-gargantua#7};
      /usr/bin/mc mb dockerminio/assets;
      exit 0;
      "

volumes:
    vol_data: