upstream keycloak_upstream {
    server keycloak:8080;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}
	
server {
    listen 80;
    server_name keycloak.local;

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name keycloak.local;

    ssl_certificate      /etc/nginx/certs/keycloak.local.crt;
    ssl_certificate_key  /etc/nginx/certs/keycloak.local.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Increase body size if you will upload files / themes
    client_max_body_size 32M;

    location / {
        proxy_pass         http://keycloak_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Port $server_port;

        # Keep WebSocket related headers (if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_redirect     off;
        proxy_buffering    off;

        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# small helper for $connection_upgrade variable
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
