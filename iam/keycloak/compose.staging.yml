services:
  keycloak_postgres:
    image: postgres:15
    container_name: keycloak_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - keycloak_net
      - ext-net

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak_app
    restart: unless-stopped
    environment:
      # Admin user for the admin console (change for production)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_URL}
      # instruct Keycloak to accept forwarded headers from the proxy
      # (docs: prefer KC_PROXY_HEADERS / proxy-headers approach — see notes)
      KC_PROXY_HEADERS: xforwarded
      # make Keycloak generate URLs based on incoming headers from proxy
      KC_HOSTNAME_STRICT: false
      # Database config (Quarkus-based Keycloak uses KC_... envs)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_postgres:5432/keycloak
      KC_DB_USERNAME:  ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["start", "--optimized"]
    depends_on:
      - keycloak_postgres
    networks:
      - keycloak_net
      - ext-net

  nginx:
    image: nginx:stable-alpine
    container_name: keycloak_nginx
    restart: unless-stopped
    # ports:
      # - "80:80"
      # - "443:443"
    ports:
      - "127.0.0.1:8843:8443"
      - "127.0.0.1:8885:8080"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - keycloak
    networks:
      - keycloak_net
      - ext-net

networks:
  keycloak_net:
    name: keycloak_net
    driver: bridge
  ext-net:
    name: shared-ext-net # External network to connect containers across different compose projects 
    external: true

volumes:
  postgres_data: